version: "3.9"
services:
  backend:
    build: ./backend
    container_name: yolo_backend
    ports:
      - "8000:8000"
    networks:
      - yolonet

  frontend:
    build: ./frontend
    container_name: yolo_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - yolonet

networks:
  yolonet:
    driver: bridge
