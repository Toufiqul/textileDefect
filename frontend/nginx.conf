server {
    listen 80;

    # This is where our static React files live inside the container
    root /usr/share/nginx/html;
    index index.html;

    # LOCATION BLOCK 1: THE API PROXY
    # Any request that comes to the server with a URL starting with /api/
    # will be handled by this block.
    location /api/ {
        # This is the magic. Nginx, which IS inside the Docker network,
        # will forward the request to the backend service using its
        # internal Docker network name.
        proxy_pass http://yolo_backend:8000/api/;
    }

    # LOCATION BLOCK 2: THE FRONTEND APP
    # Any other request will be handled here.
    location / {
        # This tries to find a file with the requested name, then a directory,
        # and if it fails, it serves index.html. This is essential for
        # client-side routing in React to work correctly.
        try_files $uri $uri/ /index.html;
    }
}
