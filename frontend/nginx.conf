server {
    listen 80;

    # This is where our static React files live inside the container
    root /usr/share/nginx/html;
    index index.html;

    # === LOCATION BLOCK 1: STATIC HEATMAPS (Most Specific) ===
    # This block must come first. It specifically matches the URL for your heatmaps.
    location /api/static/ {
        # 'alias' tells Nginx to look in this directory inside the container
        # for the requested file. This path corresponds to where the shared
        # volume is mounted in the frontend container.
        alias /usr/share/nginx/html/static/;
    }

    # === LOCATION BLOCK 2: API PROXY (Less Specific) ===
    # This block catches all other requests starting with /api/ and forwards
    # them to your backend service.
    location /api/ {
        # Forwards requests to the backend service, using the service name from docker-compose.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # === LOCATION BLOCK 3: REACT APP (Least Specific) ===
    # This is the catch-all for any other request. It's essential for a
    # single-page application like React.
    location / {
        # It tries to find a matching file, and if not found, falls back to index.html
        # to let React's router handle the URL.
        try_files $uri $uri/ /index.html;
    }
}